name: Governance Contract (RBAC)

on:
  pull_request:
    branches: [ main ]

jobs:
  governance-contract:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: phc_analytics
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phc_analytics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run governance contract (CI local Postgres)
        env:
          DATABASE_URL_ADMIN: postgresql://postgres@127.0.0.1:5432/phc_analytics?sslmode=disable
        run: |
          test -n "$DATABASE_URL_ADMIN"
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f sql/ci/bootstrap_ci.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f sql/ci/governance_contract.sql
